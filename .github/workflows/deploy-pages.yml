# Builds the React dashboard as a static site (no backend: data comes from
# the committed experiments/results/dashboard_data/*.json, predictions run
# in the browser) and publishes it to GitHub Pages on every push to master.
name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - name: Build static site
        run: npm run build:static
        env:
          VITE_STATIC_DATA: "true"
          VITE_ROUTER: hash
          VITE_BASE: /${{ github.event.repository.name }}/
          # Live-training server (e.g. https://<service>.onrender.com/api), set as
          # the repository variable LIVE_API_URL. Unset -> the live panels say
          # live training isn't connected and the recorded runs still work.
          VITE_LIVE_API_URL: ${{ vars.LIVE_API_URL }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
