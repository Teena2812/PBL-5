# Verifies the live-training backend (src/backend/live_training.py) the way it
# will be hosted: uvicorn with the deploy dependencies (requirements-live.txt,
# no Ray) inside a 512 MB / 0.1 CPU container -- Render's free instance. A
# client triggers real training runs over HTTP, consumes the SSE stream, and
# every streamed number is compared with the Flower experiment outputs and a
# direct run of the Ray-free loop. Fails on any mismatch.
name: Live training - endpoint check

on:
  push:
    branches: [multisite-data]
    paths:
      - "src/backend/**"
      - "src/federated/**"
      - "src/data/**"
      - "tests/**"
      - "requirements-live.txt"
      - ".github/workflows/live-training-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install deploy dependencies in the runtime image
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.11-slim bash -c '
            python -m venv /w/.venv &&
            /w/.venv/bin/pip install -q --upgrade pip &&
            /w/.venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu &&
            /w/.venv/bin/pip install -q -r requirements-live.txt httpx pytest &&
            /w/.venv/bin/pip freeze | grep -iE "^(torch|flwr|ray|fastapi|uvicorn)==" | tee live_versions.txt &&
            echo "ray installed: $(/w/.venv/bin/python -c "import importlib.util as u; print(u.find_spec(\"ray\") is not None)")"'

      - name: Unit tests (streaming contract)
        run: docker run --rm -v "$PWD:/w" -w /w python:3.11-slim /w/.venv/bin/python -m pytest -q tests/test_live_training.py

      - name: Direct Ray-free reference run (in-process, no server)
        run: |
          docker run --rm -i -v "$PWD:/w" -w /w python:3.11-slim /w/.venv/bin/python - <<'PY'
          import json, sys
          sys.path.insert(0, ".")
          from src.data.multisite import create_site_partitions, load_multisite
          from src.data.partition import add_local_train_test_split
          from src.federated.rayfree_runner import iter_federated_training
          x, y, df = load_multisite()
          parts = add_local_train_test_split(create_site_partitions(x, y, df), test_size=0.25, seed=42)
          ref = {
              "fedavg": list(iter_federated_training(parts, x.shape[1], n_rounds=20)),
              "fedprox": [e for e in iter_federated_training(parts, x.shape[1], n_rounds=20, proximal_mu=0.1) if e["type"] == "round"],
          }
          json.dump(ref, open("reference.json", "w"))
          print("reference final fedavg global:", ref["fedavg"][-1]["global_accuracy"])
          PY
          test -s reference.json || { echo "::error title=Reference::reference.json was not produced"; exit 1; }
          python3 -c "import json; r=json.load(open('reference.json')); print('::notice title=Direct Ray-free reference::fedavg rounds', len(r['fedavg']), 'final global', r['fedavg'][-1]['global_accuracy'], '| fedprox rounds', len(r['fedprox']))"

      - name: Start server under 512 MB / 0.1 CPU
        run: |
          docker run -d --name live --memory=512m --memory-swap=512m --cpus=0.1 -p 8000:8000 \
            -v "$PWD:/w" -w /w -e PYTHONUNBUFFERED=1 python:3.11-slim \
            /w/.venv/bin/uvicorn src.backend.main:app --host 0.0.0.0 --port 8000
          start=$(date +%s.%N)
          for i in $(seq 1 600); do
            curl -sf http://localhost:8000/api/health >/dev/null && break
            sleep 0.5
          done
          python3 -c "import sys; print(round(float(sys.argv[2]) - float(sys.argv[1]), 1))" "$start" "$(date +%s.%N)" | tee cold_start.txt

      - name: End-to-end trigger-and-stream check
        run: |
          python3 -m pip install -q httpx
          python3 tests/live_training_e2e.py http://localhost:8000 reference.json preflight_results e2e_result.json
          echo "exit=$?"

      - name: Server peak memory and annotations
        if: always()
        run: |
          peak=$(docker exec live cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo 0)
          oom=$(docker inspect -f '{{.State.OOMKilled}}' live)
          running=$(docker inspect -f '{{.State.Running}}' live)
          echo "::notice title=Server memory::peak=$((peak / 1048576)) MB, OOMKilled=$oom, still running=$running (limit 512 MB, 0.1 CPU)"
          cat live_versions.txt | tr '\n' ' ' | sed 's/^/::notice title=Versions::/'; echo
          if [ -f e2e_result.json ]; then
            python3 - <<'PY'
          import json
          s = json.load(open("e2e_result.json"))["summary"]
          print(f"::notice title=Cold start::{open('cold_start.txt').read().strip()} s from docker run to /api/health responding")
          for k in ("fedavg", "fedprox_personalized"):
              if k in s:
                  print(f"::notice title={k}::" + ", ".join(f"{a}={b}" for a, b in s[k].items()))
          print(f"::notice title=Streaming::incremental={s.get('streamed_incrementally')}, problems={len(s['problems'])}")
          for p in s["problems"][:20]:
              print(f"::error title=Mismatch::{p}")
          PY
          fi
          docker logs live 2>&1 | tail -20
